  - {id: bra, name: Bundesrechnungsabschluss, publisher: Rechnungshof, url: null, module: [money_map], status: to_find}
  - {id: eu_fts, name: EU Financial Transparency System, publisher: European Commission, url: null, module: [cross_border], status: to_find}
  - {id: kohesio, name: Kohesio (EU cohesion projects), publisher: European Commission, url: null, module: [cross_border], status: to_find}
  - {id: farm_payments, name: Agricultural payment recipients, publisher: AMA, url: null, module: [foerderungen], status: to_find}
  - {id: medientransparenz, name: Media transparency data, publisher: RTR, url: null, module: [foerderungen], status: to_find}
  - {id: procurement, name: Public procurement notices (TED and national), publisher: EU / BBG, url: null, module: [findings], status: to_find}
  - {id: eurostat_gov, name: Eurostat government finance statistics, publisher: Eurostat, url: null, module: [benchmarks], status: to_find}
  - {id: oecd_oda, name: OECD ODA statistics, publisher: OECD, url: null, module: [cross_border, benchmarks], status: to_find}
  - {id: parl_questions, name: Answers to parliamentary questions, publisher: Parlament, url: null, module: [all], status: to_find}
