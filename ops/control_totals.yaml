# Published totals that the parsed data must reproduce. Checked by ingest/report.py on every run.
# expected is in EUR. tolerance is relative (0.02 = 2 %). A check is skipped if no rows match its filter.

controls:
  - id: bund_fh_einzahlungen_2024
    description: Federal cash receipts 2024, preliminary result
    table: bmf_budget_csv/budget_2024_2028.parquet
    filter: {hh: FH, ae: "2", geschaftsjahr: "2024", kennzahl: Erfolg}
    column: betrag
    multiplier: 1000000          # file is in EUR million
    expected: 101568000000
    tolerance: 0.02              # preliminary vs final result may differ slightly
    source: https://www.parlament.gv.at/dokument/budgetdienst/budgetvollzug/BD-Vorlaeufiger-Gebarungserfolg-2024.pdf

  - id: gesamtstaat_ausgaben_2025
    description: General government expenditure 2025 (ESA 2010)
    table: eurostat_cofog/gov_10a_exp.parquet
    filter: {geo: AT, sector: S13, cofog_code: TOTAL, na_item: TE, unit: MIO_EUR, year: 2025}
    column: amount_eur
    multiplier: 1
    expected: 283000000000
    tolerance: 0.01
    source: https://www.parlament.gv.at/dokument/budgetdienst/budgetvollzug/BD-Vorlaeufiger-Gebarungserfolg-2025.pdf

  - id: gesamtstaat_ausgabenquote_2025
    description: General government expenditure ratio 2025, % of GDP
    table: eurostat_cofog/gov_10a_exp.parquet
    filter: {geo: AT, sector: S13, cofog_code: TOTAL, na_item: TE, unit: PC_GDP, year: 2025}
    column: pct_gdp
    multiplier: 1
    expected: 55.2
    tolerance: 0.01
    source: https://www.parlament.gv.at/dokument/budgetdienst/budgetvollzug/BD-Vorlaeufiger-Gebarungserfolg-2025.pdf

  - id: gesamtstaat_ausgabenquote_2024
    description: General government expenditure ratio 2024, % of GDP (implied by the 2025 report, 55.2 % after a fall of 0.1 points)
    table: eurostat_cofog/gov_10a_exp.parquet
    filter: {geo: AT, sector: S13, cofog_code: TOTAL, na_item: TE, unit: PC_GDP, year: 2024}
    column: pct_gdp
    multiplier: 1
    expected: 55.3
    tolerance: 0.02              # Eurostat vintage may predate the March 2026 GDP revision
    source: https://www.parlament.gv.at/dokument/budgetdienst/budgetvollzug/BD-Vorlaeufiger-Gebarungserfolg-2025.pdf

  - id: wien_auszahlungen_2024
    description: Vienna cash payments 2024 (central budget, Rechnungsabschluss), MVAG 32 + 34 + 36
    table: wien_ogd_haushalt/wien_vrv2015.parquet
    filter: {jahr: "2024", voranschlag_rechnungsabschluss: Rechnungsabschluss, datenquelle: Gemeinde, haushalt: Finanzierungshaushalt, mvag: "re:3[246]"}
    column: wert
    multiplier: 1
    expected: 19930000000
    tolerance: 0.005             # published figure is rounded to EUR 10 million
    source: https://wien.gv.at/spezial/leistungsberichte/leistungsberichte-der-magistratsdienststellen/magistratsabteilung-5-finanzwesen/

  - id: wien_einzahlungen_2024
    description: Vienna cash receipts 2024 (central budget, Rechnungsabschluss), MVAG 31 + 33 + 35
    table: wien_ogd_haushalt/wien_vrv2015.parquet
    filter: {jahr: "2024", voranschlag_rechnungsabschluss: Rechnungsabschluss, datenquelle: Gemeinde, haushalt: Finanzierungshaushalt, mvag: "re:3[135]"}
    column: wert
    multiplier: 1
    expected: 19980000000
    tolerance: 0.005
    source: https://wien.gv.at/spezial/leistungsberichte/leistungsberichte-der-magistratsdienststellen/magistratsabteilung-5-finanzwesen/
