name: ingest

# Runs the offline tests, then downloads and parses the sources.
# Staging tables are uploaded as a build artifact (data is not committed to git).

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  push:
    paths: ["ingest/**", "models/**", "tests/**"]

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb pandas pyarrow pdfplumber requests pyyaml pytest
      - name: Offline tests
        run: python -m pytest -q
      - name: Eurostat COFOG
        if: github.event_name != 'push'
        run: python -m ingest.eurostat_cofog --start 2015
      - name: BMF federal budget
        if: github.event_name != 'push'
        run: python -m ingest.bmf_budget_csv
      - name: Upload staging tables and raw manifests
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ github.run_id }}
          path: |
            data/staging/
            data/raw/**/manifest.json
          retention-days: 30
