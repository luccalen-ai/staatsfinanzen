[project]
name = "staatsfinanzen"
version = "0.1.0"
description = "Open model of Austrian public finances built on public data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pdfplumber>=0.11",
    "requests>=2.32",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
